name: abmiti
description: "Abmiti (আয় ব্যয় মিতি) — native Flutter client for the Abmiti personal finance API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4

  # WebView
  webview_flutter: ^4.7.0

  # Connectivity
  connectivity_plus: ^7.3.2

  # Splash screen & icons (also in dev_dependencies for tooling)
  flutter_launcher_icons: ^0.14.1

  # URL launcher for external links
  url_launcher: ^6.3.3

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#C2552A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

